<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>福引き大抽選会</title>
<!-- 見た目（CSS） -->
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="makuu"></div>
<header>
  <h1>福引き大抽選会</h1>
  <div id="dayLabel">1日目</div>
</header>

<main>
  <!-- 「A賞あと○個」の表示エリア（JavaScriptで中身を作ります） -->
  <div id="remaining" aria-live="polite"></div>

  <!-- ガラポン本体（img フォルダのSVG画像2枚を重ねています） -->
  <div class="stage">
    <img class="stand" src="../img/garapon-stand.svg" alt="">
    <img id="drum" src="../img/garapon-drum.svg" alt="">
    <div id="ball"></div>
  </div>

  <button id="startBtn">くじスタート</button>
  <p class="hint">スペースキーでもスタートできます</p>
</main>



<!-- 結果表示 -->
<div id="resultOverlay" class="overlay" hidden>
  <div id="resultCard" class="result-card">
    <div id="resultBall" class="result-ball"></div>
    <div id="resultName" class="result-name"></div>
    <div id="resultMsg" class="result-msg"></div>
    <div class="close-note">画面をタップ（またはスペースキー）で閉じる</div>
  </div>
</div>

<!-- 管理画面 -->
<div id="adminOverlay" class="overlay" hidden>
  <div class="panel">
    <!-- パスワード入力 -->
    <div id="loginBox">
      <h2>管理画面</h2>
      <p class="info">パスワードを入力してください。</p>
      <input id="pwInput" type="password" autocomplete="off">
      <p id="pwMsg" class="msg err"></p>
      <div class="btns">
        <button id="loginBtn" class="primary">開く</button>
        <button class="closeAdmin">閉じる</button>
      </div>
    </div>
    <!-- 管理メニュー -->
    <div id="adminBox" hidden>
      <h2>管理画面</h2>
      <p id="adminInfo" class="info"></p>
      <table>
        <thead><tr><th>賞</th><th>1日の個数</th><th>現在の残り</th><th>本日出た数</th></tr></thead>
        <tbody id="adminRows"></tbody>
      </table>
      <p class="info">※「1日の個数」は次の日にリセットしたときに使われる数です。</p>
      <p id="adminMsg" class="msg"></p>
      <div class="btns">
        <button id="saveBtn" class="primary">変更を保存</button>
        <button id="nextDayBtn">次の日へリセット</button>
        <button id="initBtn" class="danger">全データ初期化</button>
        <button class="closeAdmin">閉じる</button>
      </div>
    </div>
  </div>
</div>

<footer>
  <button id="adminBtn" title="管理画面" aria-label="管理画面を開く">⚙</button>
</footer>


<!-- 溜め演出の「……！？」（ふだんは透明で見えない） -->
<div id="tame" aria-hidden="true"><span>……！？</span></div>
<div id="flash"></div>
<canvas id="confetti"></canvas>

<!-- 処理（JavaScript）：config.js → sound.js → main.js の順番で読み込む -->
<script src="../js/config.js"></script>
<script src="../js/sound.js"></script>
<script src="../js/main.js"></script>

</body>
</html>
